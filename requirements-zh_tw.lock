# atm10-zh-tw — 繁體轉換的依賴鎖
#
# OpenCC 負責簡繁轉換。tree-sitter 負責 JavaScript 靜態解析。
# 轉換結果由 OpenCC 詞庫決定，
# 換一版詞庫，同一份簡體就可能轉出不同的繁體——所以和 Pillow 一樣釘死版本與雜湊。
# 另開一個檔案而不是寫進 requirements.lock：那份是上游的，合併時不想跟它衝突。
#
# 裝法（必須帶 --require-hashes）：
#     python -m pip install --require-hashes -r requirements-zh_tw.lock
#
# 升級 OpenCC 時要重跑 scripts/zh_tw/check_tw.py 的兩道閘，並抽樣比對轉換差異。

